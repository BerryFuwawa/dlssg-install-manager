name: 使用遇到问题
description: 不会安装、自动检测失败、下载错误、界面或恢复问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 README 中的新手教程和常见问题。请勿上传密码、令牌、整个游戏或备份目录；日志和截图请先遮盖私人信息。
  - type: input
    id: version
    attributes:
      label: 管理器版本
      description: 左下角 GUI 后面的版本号
      placeholder: 例如 v2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、显卡和游戏
      placeholder: Windows 版本、显卡型号、游戏名称；界面问题请补充缩放比例
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 做了什么，在哪一步出错？
      description: 请按点击顺序描述，说明你希望发生什么、实际发生什么。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 完整错误提示、截图或日志
      description: 可在“操作日志”中导出本次日志。不要只写“不能用”。分享前检查私人信息。
    validations:
      required: true
