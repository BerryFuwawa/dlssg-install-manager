name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and run isolated tests
        shell: powershell
        run: .\build.ps1 -Test
      - name: Package portable GUI
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DLSSG-Install-Manager
          path: |
            dist/DLSSG-Install-Manager.exe
            dist/update-manifest.json
            dist/*-portable.zip
          if-no-files-found: error
